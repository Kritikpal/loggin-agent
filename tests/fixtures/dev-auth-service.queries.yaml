# Gold set for search_logs over tests/fixtures/dev-auth-service.log (a real Spring Boot startup failure).
#
# expect_lines are the 1-based line numbers where a relevant EVENT STARTS (a line beginning with a timestamp).
# A question counts as answered when ANY expected event is among the top 5 hits (Recall@5).
# kind: meaning    = natural language, no identifier from the log (paraphrases share no words with it)
#       identifier = only an identifier copied from the log; the keyword leg should nail these (rank <= 3)
#       mixed      = natural language plus an identifier
#
# Event map (start line: level, gist):
#   1 INFO Hibernate Validator 8.0.3     2 INFO Java 17.0.15, PID 26512    3 INFO profile "dev"
#   4 INFO bootstrapping JPA repos        5 INFO found 8 JPA repositories   6 INFO BeanFactory id
#   7 INFO Tomcat port 8080              8 INFO ProtocolHandler http-nio-8080   9 INFO starting service [Tomcat]
#  10 INFO Apache Tomcat/11.0.12         11 INFO WebApplicationContext init     12 INFO init completed in 2416 ms
#  13 INFO HHH000204 PersistenceUnitInfo 14 INFO Hibernate ORM 6.6.33           15 INFO second-level cache disabled
#  16 INFO no LoadTimeWeaver             17 INFO HikariPool-1 starting
#  18 WARN HHH000342 could not obtain connection + RuntimeException: Driver org.postgresql.Driver claims to not
#          accept jdbcUrl, ${SPRING_DATASOURCE_URL} (stack trace to line 146)
# 147 WARN HHH90000025 PostgreSQLDialect need not be specified (deprecation)
# 148 INFO HHH10001005 Database info: driver unknown, version 12.0 (to line 155)
# 156 INFO no JTA platform               157 INFO HikariPool-1 starting (second attempt)
# 158 ERROR Failed to initialize JPA EntityManagerFactory ... Driver ... ${SPRING_DATASOURCE_URL}
# 159 ERROR Error starting Tomcat context: bean 'jwtAuthFilter' -> 'jwtService' -> 'userTableRepository'
# 160 INFO stopping service [Tomcat]
# 161 WARN --add-opens=java.base/java.lang (ThreadLocal memory leak detection)
# 162 WARN --add-opens=java.rmi/sun.rmi.transport (RMI Target memory leak detection)
# 163 WARN exception during context initialization, cancelling refresh: Unable to start web server
# 164 INFO Error starting ApplicationContext (condition evaluation report hint, to line 166)
# 167 ERROR Application run failed + full Caused-by chain down to the Driver/jdbcUrl root cause (to line 323)

queries:
  # ---- meaning ----
  - id: m-why-startup-failed
    query: Why did the application fail to start?
    kind: meaning
    expect_lines: [167, 158, 159, 163]
    note: 167 is the final failure; 158/159 the two ERRORs on the way; 163 cancels the refresh.
  - id: m-refuses-to-boot
    query: the service refuses to boot
    kind: meaning
    expect_lines: [167, 159, 163, 164]
    note: Paraphrase sharing no words with the log. 164 says "Error starting ApplicationContext".
  - id: m-cant-reach-postgres
    query: can't reach postgres
    kind: meaning
    expect_lines: [18, 158, 167]
    note: Paraphrase. 18 could not obtain a connection; 158/167 carry the org.postgresql.Driver failure.
  - id: m-root-cause
    query: What was the root cause of the crash?
    kind: meaning
    expect_lines: [167, 158, 18]
    note: 167 ends with the root cause (Driver rejects the unresolved jdbcUrl); 158 and 18 state it too.
  - id: m-placeholder-not-resolved
    query: a configuration placeholder was never replaced with a real value
    kind: meaning
    expect_lines: [18, 158, 167]
    note: The literal ${...} reached the driver; paraphrase of "unresolved environment variable".
  - id: m-errors-that-stopped-startup
    query: show me the errors that stopped the startup
    kind: meaning
    expect_lines: [158, 159, 167]
    note: Should be answered by the ERROR events specifically.
  - id: m-dependency-injection
    query: dependency injection failure while creating a component
    kind: meaning
    expect_lines: [159, 167]
    note: UnsatisfiedDependencyException / Error creating bean in 159 and in 167's cause chain.
  - id: m-web-server-shutdown
    query: Why was the embedded web server shut down?
    kind: meaning
    expect_lines: [160, 159, 163, 167]
    note: 160 stops Tomcat; 159/163/167 explain why ("Unable to start web server").
  - id: m-listen-port
    query: which port does the web server listen on
    kind: meaning
    expect_lines: [7, 8]
    note: 7 "Tomcat initialized with port 8080"; 8 "http-nio-8080".
  - id: m-java-version
    query: What Java version is the service running on?
    kind: meaning
    expect_lines: [2]
    note: Event 2 says using Java 17.0.15.
  - id: m-process-id
    query: what is the process id of the application
    kind: meaning
    expect_lines: [2]
    note: Event 2 says with PID 26512.
  - id: m-active-profile
    query: which spring profile is active
    kind: meaning
    expect_lines: [3]
    note: The following 1 profile is active "dev".
  - id: m-second-level-cache
    query: is the second-level cache turned on?
    kind: meaning
    expect_lines: [15]
    note: HHH000026 Second-level cache disabled.
  - id: m-repository-count
    query: how many JPA repositories were found during scanning
    kind: meaning
    expect_lines: [5]
    note: Event 5 says Found 8 JPA repository interfaces; 4 only says bootstrapping started, so it is not listed.
  - id: m-hibernate-version
    query: Which Hibernate ORM version is used?
    kind: meaning
    expect_lines: [14]
    note: HHH000412 Hibernate ORM core version 6.6.33.Final (1 is Hibernate Validator, a different product).
  - id: m-servlet-container-version
    query: what version of the servlet container is running
    kind: meaning
    expect_lines: [10]
    note: Starting Servlet engine [Apache Tomcat/11.0.12].
  - id: m-deprecation
    query: deprecated configuration property warning
    kind: meaning
    expect_lines: [147]
    note: org.hibernate.orm.deprecation HHH90000025.
  - id: m-memory-leak-warnings
    query: memory leak detection warnings at shutdown
    kind: meaning
    expect_lines: [161, 162]
    note: Both add-opens WARN lines mention memory leak detection.
  - id: m-connection-pool
    query: when did the database connection pool start
    kind: meaning
    expect_lines: [17, 157]
    note: HikariPool-1 Starting is logged twice.
  - id: m-context-init-time
    query: how long did the web application context take to initialize
    kind: meaning
    expect_lines: [12]
    note: Root WebApplicationContext initialization completed in 2416 ms.
  - id: m-database-version
    query: what database version was detected
    kind: meaning
    expect_lines: [148]
    note: HHH10001005 Database info ... Database version 12.0 (continuation lines 149-155).

  # ---- identifier ----
  - id: i-hhh000342
    query: HHH000342
    kind: identifier
    expect_lines: [18]
    note: Only event 18 carries this code.
  - id: i-hikaripool
    query: HikariPool-1
    kind: identifier
    expect_lines: [17, 157]
    note: Pool name, logged at 17 and 157.
  - id: i-postgresqldialect
    query: PostgreSQLDialect
    kind: identifier
    expect_lines: [147]
    note: Deprecation warning.
  - id: i-tomcat-version
    query: Tomcat/11.0.12
    kind: identifier
    expect_lines: [10]
    note: The simple parser keeps 'tomcat/11.0.12' as one token.
  - id: i-spring-datasource-url
    query: SPRING_DATASOURCE_URL
    kind: identifier
    expect_lines: [18, 158, 167]
    note: The unresolved placeholder; tokenised as spring/datasource/url.
  - id: i-jwtauthfilter
    query: jwtAuthFilter
    kind: identifier
    expect_lines: [159, 167]
    note: In 159's semantic text; 167 has it only in raw_text (its semantic text keeps the root cause instead).
  - id: i-hhh90000025
    query: HHH90000025
    kind: identifier
    expect_lines: [147]
    note: Deprecation message code.
  - id: i-postgresql-driver
    query: org.postgresql.Driver
    kind: identifier
    expect_lines: [18, 158, 167]
    note: Driver class named in the root cause.

  # ---- mixed ----
  - id: x-jwtauthfilter-fail
    query: why does jwtAuthFilter fail to be created
    kind: mixed
    expect_lines: [159, 167]
    note: Bean creation chain jwtAuthFilter -> jwtService -> userTableRepository -> entityManagerFactory.
  - id: x-env-var-wrong
    query: which environment variable is wrong, is ${SPRING_DATASOURCE_URL} set?
    kind: mixed
    expect_lines: [18, 158, 167]
    note: The placeholder reached the driver unresolved, so the variable was not set.
  - id: x-driver-jdbcurl
    query: Driver org.postgresql.Driver claims to not accept jdbcUrl
    kind: mixed
    expect_lines: [18, 158, 167]
    note: Verbatim root-cause message.
  - id: x-hikaripool-connect
    query: what happened to HikariPool-1 when it tried to connect to the database
    kind: mixed
    expect_lines: [17, 157, 18]
    note: 17/157 start the pool; 18 is the failed connection attempt (stack shows HikariPool.<init>).
  - id: x-beans-failed
    query: did the jwtService or userTableRepository beans fail?
    kind: mixed
    expect_lines: [159, 167]
    note: KNOWN RISK - both names sit past the 400-char message cut of semantic_text, so only the semantic leg can find them.
  - id: x-hhh000342-meaning
    query: what does HHH000342 mean for the database connection
    kind: mixed
    expect_lines: [18]
    note: HHH000342 Could not obtain connection to query metadata.
  - id: x-dialect-needed
    query: do I need to set PostgreSQLDialect explicitly?
    kind: mixed
    expect_lines: [147]
    note: The deprecation says it is selected by default.
  - id: x-add-opens
    query: what is the --add-opens warning about
    kind: mixed
    expect_lines: [161, 162]
    note: Both WebappClassLoaderBase warnings.
  - id: x-tomcat-port
    query: Tomcat initialized on port 8080
    kind: mixed
    expect_lines: [7, 8]
    note: Port 8080 in 7 and http-nio-8080 in 8.
  - id: x-entitymanagerfactory
    query: failed to initialize JPA EntityManagerFactory
    kind: mixed
    expect_lines: [158, 167]
    note: ERROR 158 verbatim; 167 fails for the same reason (bean 'entityManagerFactory', line 277, in its cause chain).
