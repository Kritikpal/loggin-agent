<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI workflow end to end</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · AI Business Operator</p>
    <h1>How one chat message becomes an approved campaign</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 932" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-workflow-e2e-title ai-workflow-e2e-desc">
        <title id="ai-workflow-e2e-title">AI workflow end to end</title>
        <desc id="ai-workflow-e2e-desc">Flowchart of POST /ai/chat with its five LLM calls marked: approval check, read-only agent, answer-or-action router, action planner, and background memory extraction, plus rule validation, a human approval gate and campaign creation.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ARROWS (drawn first, behind nodes) -->
        <!-- start -> approval check -->
        <line x1="320" y1="88" x2="320" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- approval check NO -> recall + agent -->
        <line x1="320" y1="248" x2="320" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- approval check YES -> approval gate (resume), left lane -->
        <path d="M180 188 H108 Q100 188 100 196 V688 Q100 696 108 696 H200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- recall + agent -> router -->
        <line x1="320" y1="356" x2="320" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- router ACTION -> plan -->
        <line x1="320" y1="516" x2="320" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- router ANSWER -> reply -->
        <line x1="460" y1="456" x2="760" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- plan INVALID -> reply -->
        <line x1="440" y1="588" x2="760" y2="588" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- plan VALID -> gate -->
        <line x1="320" y1="620" x2="320" y2="660" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- gate WAIT / REJECT -> reply -->
        <line x1="440" y1="696" x2="760" y2="696" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- gate APPROVED -> execute (accent) -->
        <line x1="320" y1="732" x2="320" y2="772" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- execute -> reply -->
        <line x1="440" y1="804" x2="760" y2="804" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- remember -> recall + agent (dashed, next turn) -->
        <line x1="760" y1="324" x2="440" y2="324" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- ARROW LABELS -->
        <rect x="130" y="168" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="144" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="330" y="262" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="342" y="271" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="330" y="528" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="352" y="537" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTION</text>

        <rect x="330" y="634" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="348" y="643" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALID</text>

        <rect x="330" y="746" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="358" y="755" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>

        <rect x="578" y="436" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER</text>

        <rect x="572" y="568" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="577" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVALID</text>

        <rect x="560" y="676" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="685" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAIT / REJECT</text>

        <rect x="572" y="784" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="793" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTED</text>

        <rect x="572" y="304" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT TURN</text>

        <!-- CALLOUT -->
        <text x="600" y="516" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">The model proposes, rules validate,</text>
        <text x="600" y="534" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">a human decides.</text>

        <!-- NODES -->
        <!-- Start -->
        <rect x="200" y="40" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="320" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Manager message</text>
        <text x="320" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /ai/chat</text>

        <!-- Decision: approval check -->
        <polygon points="320,128 460,188 320,248 180,188" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Does it decide a</text>
        <text x="320" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pending proposal?</text>
        <text x="320" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">approve / reject / other</text>

        <!-- Step: recall + agent -->
        <rect x="200" y="292" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recall notes, run agent</text>
        <text x="320" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recall: no LLM · 4 read-only tools</text>

        <!-- Decision: router -->
        <polygon points="320,396 460,456 320,516 180,456" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Question or</text>
        <text x="320" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">change request?</text>
        <text x="320" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fails closed to ACTION</text>

        <!-- Step: plan + validate -->
        <rect x="200" y="556" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="584" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plan + validate</text>
        <text x="320" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rules: max 50% off · real category</text>

        <!-- Focal: approval gate -->
        <rect x="200" y="660" width="240" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="320" y="688" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human approval gate</text>
        <text x="320" y="704" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interrupt() · stored proposal</text>
        <text x="320" y="718" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat yes/no or POST …/resume</text>

        <!-- Step: execute -->
        <rect x="200" y="772" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="800" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create campaign</text>
        <text x="320" y="816" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status approved · not sent</text>

        <!-- Optional: remember (background) -->
        <rect x="760" y="276" width="200" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="780" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Save to memory</text>
        <text x="780" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">remember() after reply</text>
        <text x="780" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">extract → 6 gates →</text>
        <text x="780" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">INSERT/UPDATE/FLAG/SKIP</text>

        <!-- External: reply -->
        <rect x="760" y="372" width="200" height="468" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="780" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Reply to manager</text>
        <text x="780" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ChatResponse · turn saved</text>
        <text x="780" y="459" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ANSWER</text>
        <text x="780" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">INVALID_ACTION</text>
        <text x="780" y="693" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">WAITING_APPROVAL</text>
        <text x="780" y="707" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">REJECTED</text>
        <text x="780" y="807" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">EXECUTED</text>

        <!-- LLM CALL NOTES -->
        <text x="476" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">runs only when a proposal</text>
        <text x="476" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">is pending; else no LLM call</text>
        <text x="476" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">keyword pre-check skips the</text>
        <text x="476" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">call when no change word</text>

        <!-- LLM CALL BADGES: order · model tier (FAST falls back to MAIN when GROQ_FAST_MODEL is unset) -->
        <rect x="396" y="140" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="422" y="149" fill="#f5f5f5" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">1 · FAST</text>
        <rect x="380" y="286" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="406" y="295" fill="#f5f5f5" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">2 · MAIN</text>
        <rect x="396" y="408" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="422" y="417" fill="#f5f5f5" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">3 · FAST</text>
        <rect x="380" y="550" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="406" y="559" fill="#f5f5f5" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">4 · MAIN</text>
        <rect x="892" y="270" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="918" y="279" fill="#f5f5f5" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">5 · MAIN</text>

        <!-- LEGEND -->
        <line x1="40" y1="868" x2="960" y2="868" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="884" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="900" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="910" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / reply</text>

        <rect x="168" y="900" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="910" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="316,906 328,900 340,906 328,912" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="910" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <rect x="482" y="900" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="514" y="910" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Human approval</text>

        <rect x="628" y="900" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="654" y="909" fill="#f5f5f5" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">n · MAIN</text>
        <text x="688" y="910" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">LLM call: order · model</text>

        <line x1="808" y1="906" x2="836" y2="906" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="844" y="910" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Background, next turn</text>
      </svg>
    </div>
  </div>
</body>
</html>
