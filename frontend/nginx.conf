server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    client_max_body_size 60m;  # log file uploads (the API caps them at UPLOAD_MAX_BODY_BYTES, 50 MB by default)
    proxy_request_buffering off;
    proxy_pass http://api:8000;
    proxy_read_timeout 300s;  # agent answers can be slow
    proxy_buffering off;      # keep streamed responses streaming
  }
  location / { try_files $uri /index.html; }
}
