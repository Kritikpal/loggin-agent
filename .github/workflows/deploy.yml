name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy  # never run two deploys at once

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trust server host key
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          sudo apt-get install -y -qq sshpass

      - name: Clone or update, build, start
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}  # read from env so it never appears in the command line
        run: |
          sshpass -e ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          DIR=/home/iamuser/logging-agent/loggin-agent
          if [ -d "$DIR/.git" ]; then
            git -C "$DIR" pull --ff-only
          else
            mkdir -p "$(dirname "$DIR")"
            git clone https://github.com/Kritikpal/loggin-agent.git "$DIR"
          fi
          cd "$DIR"
          # .env (POSTGRES_PASSWORD, GROQ_API_KEY, ...) lives on the server and is never in git
          test -f .env || { echo "missing $DIR/.env"; exit 1; }
          docker compose up -d --build
          docker compose ps
          REMOTE
