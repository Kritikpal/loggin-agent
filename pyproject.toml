[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-log-monitor"
version = "0.1.0"
description = "Local-first, read-only AI assistant that investigates application failures from local log files."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pyyaml>=6",
    "fastembed>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "langchain>=1.0",
    "langchain-groq>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: needs the isolated <db>_test PostgreSQL database",
    "slow: loads the real embedding model (downloads it on first use); run with -m slow",
]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy's async layer runs on greenlets; without this lines go unreported
